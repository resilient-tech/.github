name: Bug
description: Something worked before, or should work, and doesn't.
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        **Paste with care: this issue may be public.** Share a GSTIN, invoice number or other detail only when it's already public and needed to reproduce the problem. Never paste passwords, API keys, tokens or OTPs, and check logs and screenshots before you attach them.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw. Include the full error message.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: The app's version. For a Frappe app, also Frappe and ERPNext, from the About dialog or `bench version`.
      placeholder: |
        This app:
        Frappe:
        ERPNext:
    validations:
      required: true

  - type: input
    id: last-working
    attributes:
      label: Last version where it worked
      description: Leave empty if you don't know.

  - type: textarea
    id: logs
    attributes:
      label: Error log or traceback
      description: Take out passwords, tokens and private data first.
      render: shell
