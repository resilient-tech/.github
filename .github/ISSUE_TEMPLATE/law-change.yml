name: Law change
description: A notification, circular, advisory or government API change that needs a change here.
title: "[Law] "
type: Task
labels: ["law-change"]
body:
  - type: markdown
    attributes:
      value: |
        One issue per change in the law or API. Link the official text, not a news site. Use test values only.

  - type: dropdown
    id: authority
    attributes:
      label: Source
      options:
        - CBIC notification or circular
        - GSTN advisory
        - NIC e-invoice
        - NIC e-waybill
        - CBDT or Income Tax
        - MCA
        - Other
    validations:
      required: true

  - type: input
    id: citation
    attributes:
      label: Citation
      description: "Provision, then number and date: Rule 48(4) CGST Rules; Notfn 10/2023-CT dt 10.05.2023"
    validations:
      required: true

  - type: input
    id: link
    attributes:
      label: Official link
      description: The gazette, CBIC, GSTN or NIC page.
    validations:
      required: true

  - type: input
    id: effective
    attributes:
      label: Effective from
      description: The date it applies from, and any grace period.
      placeholder: 01.08.2023
    validations:
      required: true

  - type: textarea
    id: what-changes
    attributes:
      label: What changes, in plain words
      description: Which documents, taxpayers or amounts it covers, and what happens to documents created before the date.
    validations:
      required: true

  - type: textarea
    id: api-change
    attributes:
      label: API or schema change
      description: A cleaned sample of the new request or response, with test values only.
      render: json

  - type: input
    id: branches
    attributes:
      label: Versions that need it
      placeholder: develop, version-15, version-14
